services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: incircle
      MYSQL_USER: incircle
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: jalankan migrasi sebelum app start
  migrate:
    build: .
    restart: "no"
    command: php artisan migrate --force
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: incircle
      DB_USERNAME: incircle
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: incircle
      DB_USERNAME: incircle
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: incircle
      REVERB_HOST: ${REVERB_PUBLIC_HOST:-localhost}
      REVERB_PORT: "8080"
      REVERB_SCHEME: https
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  reverb:
    build: .
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: incircle
      DB_USERNAME: incircle
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: incircle
      REVERB_HOST: ${REVERB_PUBLIC_HOST:-localhost}
      REVERB_PORT: "8080"
      REVERB_SCHEME: https
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    build: .
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --tries=3
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: incircle
  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "80:8080"   # produksi HTTPS: 443:8080 + blok ssl di nginx.conf
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - reverb

volumes:
  mysql_data:
